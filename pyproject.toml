[project]
name = "zeci-manager-v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "erdantic>=1.2.1",
    "graphviz>=0.21",
    "pydeps>=3.0.6",
    "pylint>=4.0.6",
    "reportlab>=5.0.0",
    "ruff>=0.16.0",
]

[project.optional-dependencies]
# Entorno de test reproducible desde el propio pyproject:
#   pip install -e ".[test]"
test = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100  # o 120, el que prefieran
# Igual que pytest (norecursedirs): excluir worktrees de agentes y entorno virtual
exclude = [".claude", ".venv"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "UP",                # pyupgrade (usa sintaxis 3.12+)
    "B",                 # bugbear (bugs comunes)
    "SIM",               # simplify
    "I",                 # isort
    "N",                 # pep8-naming (clases CamelCase, funciones snake_case)
    "RUF",               # reglas propias de ruff
    "C4",                # flake8-comprehensions (simplifica list/dict comprehensions)
    "PIE",               # misc. lints útiles
    "T20",               # detecta print() olvidados
    "PTH",               # pathlib en vez de os.path
]
ignore = [
    "E501",              # el formatter se encarga
    # La UI, los docstrings y los comentarios están en español: tildes, «ñ»,
    # comillas tipográficas y guiones largos son texto correcto, no caracteres
    # sospechosos. Sin esto ruff emite ~100 avisos de puro ruido que entierran
    # los hallazgos reales.
    "RUF001",            # unicode ambiguo en cadenas
    "RUF002",            # unicode ambiguo en docstrings
    "RUF003",            # unicode ambiguo en comentarios
    "N806",              # nombres de variables locales en minúsculas con guiones bajos
]

# ---------------------------------------------------------------------------
# Reglas BLOQUEANTES (puerta de verificación de los agentes)
# ---------------------------------------------------------------------------
# No son estilo sino defectos: un nombre indefinido o un closure mal capturado
# revientan en tiempo de ejecución. El resto de reglas se reporta pero no tumba
# la verificación.
#
#     F821,F811,F632,F702,B006,B008,B023,E9
#
# Esta es la fuente de verdad de la lista. Mantener sincronizadas sus copias en:
#   · `_RUFF_BLOQUEANTES` de scripts/init.py (puerta `check_ruff`)
#   · .claude/agents/leader.md, implementer.md y reviewer.md
[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"src/infrastructure/db/seed.py" = ["T20"]   # seed puede tener prints
"scripts/*" = ["T20"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# Acotar el descubrimiento a `tests/`: sin esto pytest recorre `.venv` y
# `.claude/worktrees` y colecciona miles de tests ajenos (numpy, pandas…).
testpaths = ["tests"]
# Activa pytest-asyncio sin necesidad de marcar cada test async.
asyncio_mode = "auto"
# --strict-markers: un marker mal escrito falla en vez de pasar en silencio.
# --strict-config: un error en esta sección falla en vez de avisar.
# -ra: resumen de todo lo que no fue "passed" al final.
addopts = "--strict-markers --strict-config -ra"
norecursedirs = [".venv", ".claude", "roadmaps", "build", "dist"]
markers = [
    "unit: prueba unitaria pura (sin BD ni UI real)",
    "integration: toca repositorios SQLite / escenarios multi-tenant",
    "slow: prueba lenta (estrés, generación combinatoria)",
    "e2e: flujo de UI real con nicegui.testing (headless)",
    "browser: flujo de navegador real con Playwright (opt-in)",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/infrastructure/db/seed.py",   # datos de siembra, no lógica a cubrir
    "src/reference/divipola.py",       # tabla de datos geográficos
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Trinquete: solo se aplica cuando se corre con cobertura (modo `completo` del
# runner o `pytest --cov`). El `pytest` por defecto NO mide cobertura para no
# ralentizar el día a día. Subir este número a medida que crece la cobertura;
# nunca bajarlo. Actual medido: ~46 % (arrastrado por la capa UI sin unit-tests).
fail_under = 45
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
]
