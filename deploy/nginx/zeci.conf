# =============================================================================
# ZECI Manager v2 — Plantilla nginx (seguridad_web_01 — R1-R7)
#
# PLACEHOLDERS a sustituir antes de usar:
#   YOUR_DOMAIN        → dominio real (ej. zeci.ejemplo.org)
#   APP_PORT           → puerto de la app Python (por defecto 8080)
#   /path/to/cert      → ruta al certificado Let's Encrypt o similar
#
# La app escucha en loopback (127.0.0.1:APP_PORT). Nunca exponer
# directamente a 0.0.0.0 sin este proxy por delante.
#
# Verificación manual en servidor: nginx -t -c /ruta/a/zeci.conf
# =============================================================================

# ─── Mapa para el handshake WebSocket (R4) ───────────────────────────────────
# `Connection` debe ser "upgrade" SOLO cuando el cliente pide upgrade; fijarlo
# siempre es HTTP/1.1 mal formado y anula keep-alive en las peticiones normales.
# Va en contexto http: este fichero se incluye desde el bloque http de nginx.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── Redirige todo HTTP → HTTPS (R3) ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    return 301 https://$host$request_uri;
}

# ─── HTTPS + proxy a la app (R1, R4, R5, R7) ─────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR_DOMAIN;

    # Certificado (R1, R6 — renovación automática con certbot/acme)
    ssl_certificate     /path/to/cert/fullchain.pem;
    ssl_certificate_key /path/to/cert/privkey.pem;

    # Solo TLS 1.2 y 1.3 (R7)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Ciphers fuertes — ECDHE + AES-GCM/ChaCha20 (R7)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # ─── Cabeceras de seguridad ──────────────────────────────────────────────
    # HSTS: 2 años. Activo por defecto — el bloque :80 de arriba ya fuerza
    # HTTPS, así que llegar aquí implica que TLS funciona.
    # Añade `; includeSubDomains` solo si TODOS los subdominios sirven HTTPS.
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Anti-clickjacking sobre sesión autenticada. CSP frame-ancestors es la
    # forma moderna; X-Frame-Options queda por navegadores antiguos.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Impide que el navegador adivine el tipo MIME (XSS vía subida de ficheros).
    add_header X-Content-Type-Options "nosniff" always;

    # No filtrar rutas internas (con IDs de estudiante) al navegar a terceros.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # DH params para DHE (generar una vez: openssl dhparam -out /etc/nginx/dhparam.pem 2048)
    # ssl_dhparam /etc/nginx/dhparam.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    location / {
        # Proxy a la app Python (R2: app escucha solo en loopback)
        proxy_pass http://127.0.0.1:APP_PORT;
        proxy_http_version 1.1;

        # WebSocket passthrough para NiceGUI (R4)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Cabeceras de contexto (R5)
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tamaño máximo de subida. El default de nginx es 1 MB, que rompe los
        # `ui.upload` de importación de estudiantes y de horarios.
        client_max_body_size 20m;

        proxy_read_timeout 86400s;  # WebSockets de larga duración
        proxy_send_timeout 86400s;  # ídem en sentido servidor → cliente
    }
}
